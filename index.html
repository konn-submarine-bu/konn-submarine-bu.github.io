<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="/" class="site-title">Ink</a>
      <nav class="site-nav">
        <a href="/">Posts</a>
        <a href="#about">About</a>
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <main>
      <section id="home" class="page">
        <div class="hero">
          <img src="images/avatar.jpg" alt="avatar" class="avatar" onerror="this.style.display='none'">
          <h1 class="hero-title">Ink &amp; Stillness</h1>
          <p class="hero-subtitle">Quiet notes on a fleeting world.</p>
        </div>
        <nav class="category-tabs" id="category-tabs">
          <button class="cat-tab active" data-cat="all">All</button>
          <button class="cat-tab" data-cat="Musings">Musings</button>
          <button class="cat-tab" data-cat="Workshop">Workshop</button>
        </nav>
        <div class="post-list" id="post-list">
          <p class="loading">载入中...</p>
        </div>
      </section>

      <article id="post" class="page" style="display:none">
        <div class="post-content" id="post-content"></div>
      </article>

      <section id="about" class="page" style="display:none">
        <div class="post-content" id="about-content"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> · Marked in Ink</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
